services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://apontaua:apontaua@db:5432/apontaua
      FILE_STORAGE_PATH: /data/files
    ports:
      - "8000:8000"
    volumes:
      - uploaded_files:/data/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apontaua
      POSTGRES_USER: apontaua
      POSTGRES_PASSWORD: apontaua
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apontaua -d apontaua"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_files:

