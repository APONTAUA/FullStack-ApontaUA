services:
  api:
    build: .
    env_file:
      - path: ${APONTAUA_ENV_FILE:-.env}
        required: true
    environment:
      POSTGRES_HOST: db
      FILE_STORAGE_PATH: /data/files
      DB_USER: ${DB_USER:-apontaua_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored environment file}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploaded_files:/data/files
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apontaua}
      POSTGRES_USER: ${POSTGRES_USER:-apontaua_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
      APP_DB_USER: ${DB_USER:-apontaua_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the ignored environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/10-restrict-app-role.sh:/docker-entrypoint-initdb.d/10-restrict-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_files:

