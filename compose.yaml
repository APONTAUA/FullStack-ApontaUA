services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_HMR_CLIENT_PORT: ${WEB_PORT:-8080}
    expose:
      - "5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ${APONTAUA_ENV_FILE:-.env}
        required: false
    environment:
      APP_NAME: ${APP_NAME:-ApontaUA API}
      APP_ENV: ${APP_ENV:-development}
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-apontaua}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DB_USER: ${DB_USER:?Define DB_USER no ficheiro de ambiente}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro de ambiente}
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9000}}
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:?Define MINIO_APP_USER no ficheiro de ambiente}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?Define MINIO_APP_PASSWORD no ficheiro de ambiente}
      MINIO_BUCKET: ${MINIO_BUCKET:-apontaua-files}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      FILE_STORAGE_PATH: /data/files
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploaded_files:/data/files
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:17.12-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apontaua}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER no ficheiro de ambiente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no ficheiro de ambiente}
      APP_DB_USER: ${DB_USER:?Define DB_USER no ficheiro de ambiente}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD no ficheiro de ambiente}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/10-restrict-app-role.sh:/docker-entrypoint-initdb.d/10-restrict-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: apontaua/minio-server:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./minio
      dockerfile: Server.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER no ficheiro de ambiente}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD no ficheiro de ambiente}
      MINIO_APP_USER: ${MINIO_APP_USER:?Define MINIO_APP_USER no ficheiro de ambiente}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Define MINIO_APP_PASSWORD no ficheiro de ambiente}
      MINIO_BUCKET: ${MINIO_BUCKET:-apontaua-files}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-init-ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.30.6-alpine3.24
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  uploaded_files:
  minio_data:
