name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.8
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked backend dependencies
        run: uv sync --locked --group test

      - name: Run backend tests
        run: uv run --locked --group test pytest -q

      - name: Lint backend
        run: uv run --locked --group test ruff check backend

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration with dummy values
        env:
          APP_ENV: test
          DB_USER: ci_app
          DB_PASSWORD: ci_only_password
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_only_postgres_password
          MINIO_ROOT_USER: ci_minio_root
          MINIO_ROOT_PASSWORD: ci_only_minio_root_password
          MINIO_APP_USER: ci_minio_app
          MINIO_APP_PASSWORD: ci_only_minio_app_password
        run: docker compose config --quiet

      - name: Validate deployment Compose image references
        env:
          API_IMAGE: ghcr.io/apontaua/fullstack-apontaua-api:ci
          WEB_IMAGE: ghcr.io/apontaua/fullstack-apontaua-web:ci
          POSTGRES_IMAGE: postgres:17.12-alpine3.24
          COMPOSE_PROJECT_NAME: apontaua-ci
          APP_ENV: test
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_only_postgres_password
          DB_USER: ci_app
          DB_PASSWORD: ci_only_password
          MINIO_ROOT_USER: ci_minio_root
          MINIO_ROOT_PASSWORD: ci_only_minio_root_password
          MINIO_APP_USER: ci_minio_app
          MINIO_APP_PASSWORD: ci_only_minio_app_password
          MINIO_PUBLIC_ENDPOINT: https://ci.invalid
          ALLOWED_HOSTS: '["ci.invalid"]'
        run: docker compose -f compose.deployment.yaml config --quiet

  publish-images:
    name: Publish application images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs:
      - backend
      - frontend
      - compose-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/apontaua/fullstack-apontaua-api
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=dev

      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Generate web image metadata
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/apontaua/fullstack-apontaua-web
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=dev

      - name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployment/Dockerfile.web
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
