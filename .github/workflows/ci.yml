name: CI

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.8
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked backend dependencies
        run: uv sync --locked --group test

      - name: Run backend tests
        run: uv run --locked --group test pytest -q

      - name: Lint backend
        run: uv run --locked --group test ruff check backend

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration with dummy values
        env:
          APP_ENV: test
          DB_USER: ci_app
          DB_PASSWORD: ci_only_password
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_only_postgres_password
          MINIO_ROOT_USER: ci_minio_root
          MINIO_ROOT_PASSWORD: ci_only_minio_root_password
          MINIO_APP_USER: ci_minio_app
          MINIO_APP_PASSWORD: ci_only_minio_app_password
        run: docker compose config --quiet
