name: ${COMPOSE_PROJECT_NAME:-apontaua-deployment}

services:
  web:
    image: ${WEB_IMAGE:?Define WEB_IMAGE as a published GHCR image reference}
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:-apontaua-files}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks:
      - proxy
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -ec
        - wget -q -O /dev/null http://127.0.0.1:8080/nginx-health && wget -q -O /dev/null http://127.0.0.1:8080/
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?Define API_IMAGE as a published GHCR image reference}
    environment:
      APP_NAME: ${APP_NAME:-ApontaUA API}
      APP_ENV: production
      API_V1_PREFIX: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DB_USER: ${DB_USER:?Define DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the local deployment environment}
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?Define the public origin used for signed MinIO URLs}
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:?Define MINIO_APP_USER}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?Define MINIO_APP_PASSWORD in the local deployment environment}
      MINIO_BUCKET: ${MINIO_BUCKET:-apontaua-files}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      FILE_STORAGE_PATH: /data/files
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Define ALLOWED_HOSTS for the deployment}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    volumes:
      - uploaded_files:/data/files
    networks:
      - proxy
      - data
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db:
    image: ${POSTGRES_IMAGE:-postgres:17.12-alpine3.24}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the local deployment environment}
      APP_DB_USER: ${DB_USER:?Define DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in the local deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/10-restrict-app-role.sh:/docker-entrypoint-initdb.d/10-restrict-app-role.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: apontaua/minio-server:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./minio
      dockerfile: Server.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER in the local deployment environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD in the local deployment environment}
      MINIO_APP_USER: ${MINIO_APP_USER:?Define MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Define MINIO_APP_PASSWORD in the local deployment environment}
      MINIO_BUCKET: ${MINIO_BUCKET:-apontaua-files}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - minio_data:/data
    networks:
      - proxy
      - data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/minio-init-ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

networks:
  proxy:
  data:
    internal: true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-apontaua-deployment-postgres-data}
  uploaded_files:
    name: ${UPLOADED_FILES_VOLUME_NAME:-apontaua-deployment-uploaded-files}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-apontaua-deployment-minio-data}
